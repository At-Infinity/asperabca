<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspera BCA</title>
</head>
<body>
    <footer>
        <div class="quick-links">
            <a href="https://drive.google.com/drive/folders/1oLBvb2aYoeqWqu2HcctVbdg1M_uzRE2_">Image Gallery</a>
        </div>
    </footer>
    <div class="registration-container">
        <h2>Registration Form</h2>
        <form>
            <!-- Other form fields -->
            <div class="image-gallery">
                <label for="gallery-url">Image Gallery:</label>
                <input type="text" id="gallery-url" value="https://drive.google.com/drive/folders/1oLBvb2aYoeqWqu2HcctVbdg1M_uzRE2_" readonly>
                <a href="https://drive.google.com/drive/folders/1oLBvb2aYoeqWqu2HcctVbdg1M_uzRE2_" target="_blank">Open Gallery</a>
                <button type="button" onclick="copyLink()">Copy Link</button>
            </div>
        </form>
    </div>
    <script>
        function copyLink() {
            const copyText = document.getElementById("gallery-url");
            copyText.select();
            document.execCommand("copy");
            alert("Link copied to clipboard!");
        }
    </script>
</body>
</html>
